<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zombie Baseball — Fungames4you</title>
  <style>
    body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,Arial}
    #ui{position:fixed;left:12px;top:12px;z-index:10}
    canvas{display:block;margin:0 auto;background:#0a0f1a;max-width:100%;height:auto}
    .score{font-weight:700;color:#2dd4bf}
    .hint{font-size:14px;color:#9fb}
  </style>
</head>
<body>
  <div id="ui"><div class="score">Score: <span id="score">0</span></div><div class="hint">Click to hit — press R to reset — Esc to close</div></div>
  <canvas id="game" width="800" height="450" aria-label="Zombie Baseball Game"></canvas>
  <script>
    // Simple Zombie Baseball mini-game
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    let zombies = [];
    let balls = [];
    let score = 0;
    let spawnTimer = 0; let spawnInterval = 120; // frames

    function rand(min,max){return Math.random()*(max-min)+min}

    function spawnZombie(){
      const y = rand(80, H-80);
      const fromLeft = Math.random() < 0.5;
      zombies.push({x: fromLeft? -40 : W+40, y, vx: fromLeft? rand(0.6,1.4) : -rand(0.6,1.4), w:40, h:54, hp:1});
    }

    function update(){
      // spawn
      spawnTimer++;
      if(spawnTimer >= spawnInterval){ spawnTimer=0; spawnInterval = Math.max(40, 100 - Math.floor(score/5)); spawnZombie(); }
      // update zombies
      for(let z of zombies){ z.x += z.vx; }
      // update balls
      for(let b of balls){ b.x += b.vx; b.y += b.vy; b.vy += 0.25; b.life--; }
      // collisions
      for(let i=zombies.length-1;i>=0;i--){
        const z = zombies[i];
        // remove if out of bounds
        if(z.x < -100 || z.x > W+100){ zombies.splice(i,1); continue; }
        for(let j=balls.length-1;j>=0;j--){
          const b = balls[j];
          if(b.life<=0) { balls.splice(j,1); continue; }
          const dx = z.x - b.x; const dy = z.y - b.y; const dist = Math.hypot(dx,dy);
          if(dist < 30){ // hit
            score += 10;
            document.getElementById('score').textContent = score;
            balls.splice(j,1);
            z.hp--;
            if(z.hp <= 0){ zombies.splice(i,1); }
            break;
          }
        }
      }
      // cleanup balls
      balls = balls.filter(b=>b.life>0 && b.y < H+50);
    }

    function draw(){
      ctx.clearRect(0,0,W,H);
      // background
      ctx.fillStyle = '#071127'; ctx.fillRect(0,0,W,H);
      // ground
      ctx.fillStyle = '#16202b'; ctx.fillRect(0,H-60,W,60);
      // draw zombies
      for(let z of zombies){
        ctx.save(); ctx.translate(z.x,z.y);
        // body
        ctx.fillStyle = '#6b8f6b'; ctx.fillRect(-z.w/2, -z.h/2, z.w, z.h);
        // eyes
        ctx.fillStyle = '#fff'; ctx.fillRect(-10,-16,6,6); ctx.fillRect(4,-16,6,6);
        // mouth
        ctx.fillStyle = '#2d2'; ctx.fillRect(-8,4,16,6);
        ctx.restore();
      }
      // draw balls
      for(let b of balls){ ctx.beginPath(); ctx.fillStyle='#f5d'; ctx.arc(b.x,b.y,8,0,Math.PI*2); ctx.fill(); }

      // draw bat at bottom-right
      ctx.save(); ctx.translate(W-140, H-90);
      ctx.fillStyle='#b86'; ctx.fillRect(-10,-40,100,14); ctx.fillStyle='#7b4'; ctx.fillRect(60,-22,12,12);
      ctx.restore();

      // HUD
      ctx.fillStyle='#fff'; ctx.font='18px system-ui'; ctx.fillText('Zombie Baseball', 12, 28);
    }

    function loop(){ update(); draw(); requestAnimationFrame(loop); }
    loop();

    // click to throw a ball towards click position
    canvas.addEventListener('click', function(e){
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      // spawn ball from bat position
      const sx = W-90, sy = H-100;
      const angle = Math.atan2(y-sy, x-sx);
      const speed = 8 + Math.random()*3;
      balls.push({x:sx, y:sy, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 120});
    });

    // keyboard
    window.addEventListener('keydown', function(e){
      if(e.key === 'r' || e.key === 'R'){ zombies=[]; balls=[]; score=0; document.getElementById('score').textContent = score; }
      if(e.key === 'Escape'){ try{ window.parent.postMessage({type:'close-modal'}, '*'); }catch(e){} }
    });

    // listen for parent messages (close)
    window.addEventListener('message', function(ev){ if(ev && ev.data && ev.data.type === 'close-modal') { try{ window.parent.postMessage({type:'close-modal-ack'}, '*'); }catch(e){} } });
  </script>
</body>
</html>
