<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fungames4you — Play Free Games</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Fungames4you</h1>
    <p>Play free HTML5 games — add your own. Host on GitHub Pages for free.</p>
  </header>

  <main class="container">
    <section class="controls">
      <input id="search" placeholder="Search games..." />
      <button id="add-game-btn">Add game (template)</button>
    </section>

    <section id="games-grid" class="games-grid" aria-live="polite">
      <!-- Games will be loaded here from games.json -->
    </section>
  </main>

  <!-- Modal to host the game iframe -->
  <div id="game-modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="close-modal" class="close-btn" aria-label="Close">✕</button>
      <h2 id="modal-title"></h2>
      <iframe id="game-frame" src="" frameborder="0" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
